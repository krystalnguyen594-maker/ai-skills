skill_id: pdf-creator
skill_version: 1.0.0
title: Adaptive PDF Creator Specification Rubric
description: Evaluates document profiling, page-break avoidance, print layout
  budgets, Vietnamese typography, and running headers/footers.
task_types:
  - id: pdf_spec
    name: Adaptive PDF Creator Layout Specification
    required_sections:
      - pattern: profiling|khảo sát tài liệu|page budget
        name: Document Profiling & Page Budget
        severity: critical
      - pattern: page break|chống gãy trang|break-inside
        name: Page Break & Flow Control
        severity: critical
      - pattern: typography|phông chữ|spacing
        name: Professional Typography & Layout Tokens
        severity: major
      - pattern: header|footer|số trang|vietnamese
        name: Print Header/Footer & Vietnamese Font Setup
        severity: critical
prohibited_patterns:
  pdf_spec:
    - pattern: hardcode height px|để mặc định|cắt đôi bảng
      issue_code: broken_pdf_layout_anti_pattern
      description: Cấm hardcode chiều cao tĩnh gây tràn trang hoặc để bảng bị cắt đôi
        ngang thân.
      severity: critical
rubric_dimensions:
  - dimension: completeness
    name: Độ Đầy Đủ (Completeness)
    weight: 0.3
  - dimension: soundness
    name: Tính Chặt Chẽ & Đúng Đắn (Soundness)
    weight: 0.35
  - dimension: actionability
    name: Tính Khả Thi & Hành Động (Actionability)
    weight: 0.2
  - dimension: clarity
    name: Định Dạng & Rõ Ràng (Clarity)
    weight: 0.15
scoring:
  pass_threshold: 80
  scale: 100
  critical_issue_behavior: instant_fail
