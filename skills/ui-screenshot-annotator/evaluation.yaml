skill_id: ui-screenshot-annotator
skill_version: 1.0.0
title: UI Screenshot Annotation & SOP Packaging Rubric
description: Evaluates coordinate accuracy, non-overlapping badge placement,
  directional callouts, and step-by-step SOP instructions.
task_types:
  - id: screenshot_annotation
    name: UI Screenshot Annotation Specification
    required_sections:
      - pattern: viewport|ngữ cảnh ảnh chụp|màn hình
        name: Screenshot Context & Viewport Bounds
        severity: critical
      - pattern: bounding box|tọa độ|callout
        name: Coordinate-Accurate Callouts & Badges
        severity: critical
      - pattern: visual flow|mũi tên|thứ tự
        name: Sequential Visual Flow & Directional Arrows
        severity: major
      - pattern: sop|hướng dẫn thao tác|chú thích|operational guidance
        name: Step-by-Step SOP Operational Guidance
        severity: critical
prohibited_patterns:
  screenshot_annotation:
    - pattern: badge đè lên chữ|che khuất nút|không đánh số
      issue_code: obscuring_annotation_anti_pattern
      description: Cấm đặt badge đè che mất chữ trên nút bấm hoặc gắn callout lộn xộn
        không số thứ tự.
      severity: critical
rubric_dimensions:
  - dimension: completeness
    name: Độ Đầy Đủ (Completeness)
    weight: 0.3
  - dimension: soundness
    name: Tính Chặt Chẽ & Đúng Đắn (Soundness)
    weight: 0.35
  - dimension: actionability
    name: Tính Khả Thi & Hành Động (Actionability)
    weight: 0.2
  - dimension: clarity
    name: Định Dạng & Rõ Ràng (Clarity)
    weight: 0.15
scoring:
  pass_threshold: 80
  scale: 100
  critical_issue_behavior: instant_fail
