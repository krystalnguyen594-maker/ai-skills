skill_id: test-strategy
skill_version: 1.0.0
title: Test Strategy & Quality Engineering Rubric
description: Evaluates risk-based scoping, test pyramid layer distribution,
  entry/exit criteria, and regression release gates.
task_types:
  - id: test_strategy
    name: Test Strategy & Quality Engineering Spec
    required_sections:
      - pattern: risk|scoping|đánh giá rủi ro|phạm vi
        name: Risk-based Scoping & Impact Matrix
        severity: critical
      - pattern: test pyramid|layer|phân tầng kiểm thử
        name: Test Layer Distribution & Coverage Allocation
        severity: critical
      - pattern: quality gates|tiêu chí vào ra|entry exit
        name: Entry & Exit Quality Gates
        severity: critical
      - pattern: regression scope|hồi quy|môi trường
        name: Regression & Environment Strategy
        severity: major
prohibited_patterns:
  test_strategy:
    - pattern: test tay 100%|không phân loại rủi ro|bỏ qua kiểm thử tự động
      issue_code: unprioritized_test_strategy_anti_pattern
      description: Cấm lên chiến lược chỉ test thủ công toàn bộ mà không phân tầng rủi ro.
      severity: critical
rubric_dimensions:
  - dimension: completeness
    name: Độ Đầy Đủ (Completeness)
    weight: 0.3
  - dimension: soundness
    name: Tính Chặt Chẽ & Đúng Đắn (Soundness)
    weight: 0.35
  - dimension: actionability
    name: Tính Khả Thi & Hành Động (Actionability)
    weight: 0.2
  - dimension: clarity
    name: Định Dạng & Rõ Ràng (Clarity)
    weight: 0.15
scoring:
  pass_threshold: 80
  scale: 100
  critical_issue_behavior: instant_fail
