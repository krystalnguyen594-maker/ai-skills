skill_id: agent-handoff-contract
skill_version: 1.0.0
title: Agent Handoff Contract Rubric
description: Evaluates multi-agent handoff packets, context transfer,
  input/output contracts, risk escalation, and assumption logs.
task_types:
  - id: agent_handoff
    name: Multi-Agent Handoff Packet
    required_sections:
      - pattern: context|bối cảnh|mục tiêu
        name: Handoff Context & Objective
        severity: critical
      - pattern: contract|deliverable|kết quả bàn giao
        name: Deliverable Artifacts & Contract
        severity: critical
      - pattern: assumptions|giả định|rủi ro
        name: Assumptions & Known Risks
        severity: major
      - pattern: escalation|chuyển giao|người nhận
        name: Next Owner & Escalation Trigger
        severity: critical
prohibited_patterns:
  agent_handoff:
    - pattern: tự suy đoán|tự đoán|chắc là|xong rồi đấy
      issue_code: unverified_assumption_leak
      description: Cấm đoán mò yêu cầu mà không ghi log giả định rõ ràng.
      severity: critical
rubric_dimensions:
  - dimension: completeness
    name: Độ Đầy Đủ (Completeness)
    weight: 0.3
  - dimension: soundness
    name: Tính Chặt Chẽ & Đúng Đắn (Soundness)
    weight: 0.35
  - dimension: actionability
    name: Tính Khả Thi & Hành Động (Actionability)
    weight: 0.2
  - dimension: clarity
    name: Định Dạng & Rõ Ràng (Clarity)
    weight: 0.15
scoring:
  pass_threshold: 80
  scale: 100
  critical_issue_behavior: instant_fail
