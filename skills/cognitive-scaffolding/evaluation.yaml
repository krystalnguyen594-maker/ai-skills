skill_id: cognitive-scaffolding
skill_version: 1.0.0
title: Cognitive Scaffolding & Progressive Explanation Rubric
description: Evaluates cognitive bridges, the Anchor-Bridge-Target model, Minto
  Pyramid progression, and curse-of-knowledge elimination.
task_types:
  - id: cognitive_explanation
    name: Progressive Explanation & Cognitive Scaffolding
    required_sections:
      - pattern: anchor|neo nhận thức|điểm tựa
        name: Cognitive Anchor & Reader Pain Point
        severity: critical
      - pattern: bridge|bắc cầu|minto|dẫn dắt
        name: Progressive Reasoning Bridge & Analogy
        severity: critical
      - pattern: target concept|khái niệm đích|bản chất
        name: Target Concept Mastery & Mental Model
        severity: critical
      - pattern: verification|kiểm chứng|câu hỏi hiểu bài
        name: Check for Understanding & Practical Takeaway
        severity: major
prohibited_patterns:
  cognitive_explanation:
    - pattern: nhảy ngay vào thuật ngữ|ném một đống từ khó|không giải thích bối cảnh
      issue_code: curse_of_knowledge_violation
      description: Cấm nhảy xổ vào thuật ngữ phức tạp khi chưa neo nhận thức người đọc.
      severity: critical
rubric_dimensions:
  - dimension: completeness
    name: Độ Đầy Đủ (Completeness)
    weight: 0.3
  - dimension: soundness
    name: Tính Chặt Chẽ & Đúng Đắn (Soundness)
    weight: 0.35
  - dimension: actionability
    name: Tính Khả Thi & Hành Động (Actionability)
    weight: 0.2
  - dimension: clarity
    name: Định Dạng & Rõ Ràng (Clarity)
    weight: 0.15
scoring:
  pass_threshold: 80
  scale: 100
  critical_issue_behavior: instant_fail
