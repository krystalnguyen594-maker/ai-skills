skill_id: web-prototyping
skill_version: 1.0.0
title: Web Prototyping Best Practices Rubric
description: Evaluates modern frontend architecture (Vite/React/HTML), component
  hierarchy, responsive tokens, and micro-interactions.
task_types:
  - id: web_prototype_spec
    name: Web Prototype Architecture Specification
    required_sections:
      - pattern: tech stack|kiến trúc|framework
        name: Modern Tech Stack Architecture
        severity: critical
      - pattern: component hierarchy|cấu trúc component|state
        name: Component Breakdown & State Management
        severity: critical
      - pattern: responsive layout|design tokens|bảng màu
        name: Responsive Layout & Tailored Tokens
        severity: critical
      - pattern: interactive states|micro-interactions|hover
        name: Interactive States & Micro-animations
        severity: major
prohibited_patterns:
  web_prototype_spec:
    - pattern: nhét toàn bộ vào 1 file|monolith 5000 dòng|không có tương tác
      issue_code: monolithic_prototype_anti_pattern
      description: Cấm nhét mã nguồn nguyên khối vào 1 file duy nhất hoặc thiếu tương
        tác người dùng.
      severity: critical
rubric_dimensions:
  - dimension: completeness
    name: Độ Đầy Đủ (Completeness)
    weight: 0.3
  - dimension: soundness
    name: Tính Chặt Chẽ & Đúng Đắn (Soundness)
    weight: 0.35
  - dimension: actionability
    name: Tính Khả Thi & Hành Động (Actionability)
    weight: 0.2
  - dimension: clarity
    name: Định Dạng & Rõ Ràng (Clarity)
    weight: 0.15
scoring:
  pass_threshold: 80
  scale: 100
  critical_issue_behavior: instant_fail
