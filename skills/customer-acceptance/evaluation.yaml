skill_id: customer-acceptance
skill_version: 1.0.0
title: Customer Acceptance & UAT Rubric
description: Evaluates user acceptance testing reviews, persona discipline,
  accept/reject verdicts, and objective criteria-based evaluation.
task_types:
  - id: uat_acceptance
    name: Customer Acceptance & UAT Verdict
    required_sections:
      - pattern: persona|vai trò người dùng|bối cảnh nghiệp vụ
        name: Customer Persona & Real-world Context
        severity: critical
      - pattern: acceptance criteria|criteria-based|tiêu chí chấp nhận|kịch bản kiểm tra
        name: Criteria-based Checklist
        severity: critical
      - pattern: evidence|bằng chứng|kết quả kiểm thử
        name: Objective Evidence & Defect Log
        severity: critical
      - pattern: verdict|quyết định|chấp thuận|từ chối
        name: Formal Verdict & Business Impact
        severity: critical
prohibited_patterns:
  uat_acceptance:
    - pattern: tôi không thích|nhìn ngứa mắt|cảm tính cá nhân
      issue_code: subjective_taste_anti_pattern
      description: Đánh giá UAT phải căn cứ tiêu chí nghiệm thu, cấm chê bai cảm tính.
      severity: critical
rubric_dimensions:
  - dimension: completeness
    name: Độ Đầy Đủ (Completeness)
    weight: 0.3
  - dimension: soundness
    name: Tính Chặt Chẽ & Đúng Đắn (Soundness)
    weight: 0.35
  - dimension: actionability
    name: Tính Khả Thi & Hành Động (Actionability)
    weight: 0.2
  - dimension: clarity
    name: Định Dạng & Rõ Ràng (Clarity)
    weight: 0.15
scoring:
  pass_threshold: 80
  scale: 100
  critical_issue_behavior: instant_fail
