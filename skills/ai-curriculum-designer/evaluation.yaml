skill_id: ai-curriculum-designer
skill_version: 1.0.0
title: AI CURRICULUM DESIGNER Quality Rubric
description: Standardized rubric and quality criteria for auditing and executing
  the ai-curriculum-designer skill.
task_types:
  - id: ai_curriculum_designer_task
    name: ai curriculum designer execution
    required_sections:
      - pattern: overview|tổng quan|bối cảnh
        name: Context & Objectives
        severity: major
      - pattern: guidelines|nguyên tắc|quy tắc
        name: Core Principles & Guidelines
        severity: critical
      - pattern: step|quy trình|thực hiện
        name: Step-by-step Execution
        severity: critical
      - pattern: output|kết quả|deliverable
        name: Standard Deliverable Output
        severity: critical
prohibited_patterns:
  ai_curriculum_designer_task:
    - pattern: làm qua loa|không rõ ràng|tùy ý
      issue_code: vague_execution
      description: Bắt buộc phải có hướng dẫn và kết quả cụ thể.
      severity: major
rubric_dimensions:
  - dimension: completeness
    name: Độ Đầy Đủ (Completeness)
    weight: 0.3
  - dimension: soundness
    name: Tính Chặt Chẽ & Đúng Đắn (Soundness)
    weight: 0.35
  - dimension: actionability
    name: Tính Khả Thi & Hành Động (Actionability)
    weight: 0.2
  - dimension: clarity
    name: Định Dạng & Rõ Ràng (Clarity)
    weight: 0.15
scoring:
  pass_threshold: 80
  scale: 100
  critical_issue_behavior: instant_fail
