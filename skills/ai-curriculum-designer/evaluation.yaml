skill_id: ai-curriculum-designer
skill_version: 1.0.0
title: AI Curriculum Designer Rubric
description: Evaluates active learning study plans, Bloom's taxonomy objectives,
  talk-show format agendas, and practical exercises.
task_types:
  - id: curriculum_design
    name: Active Learning Curriculum & Study Guide
    required_sections:
      - pattern: persona|đối tượng|tiền đề|prerequisite
        name: Target Persona & Prerequisites
        severity: critical
      - pattern: mục tiêu đào tạo|learning objectives|bloom
        name: Learning Objectives & Competencies
        severity: critical
      - pattern: lộ trình|syllabus|talk show|chủ đề
        name: Active Learning Syllabus & Modules
        severity: critical
      - pattern: thực hành|bài tập|đánh giá|criteria
        name: Hands-on Exercises & Assessment Rubric
        severity: critical
prohibited_patterns:
  curriculum_design:
    - pattern: chỉ nghe thuyết trình|không có thực hành|học vẹt
      issue_code: passive_learning_anti_pattern
      description: Cấm tổ chức đào tạo chỉ đọc chép thụ động, bắt buộc có bài tập thực
        chiến.
      severity: critical
rubric_dimensions:
  - dimension: completeness
    name: Độ Đầy Đủ (Completeness)
    weight: 0.3
  - dimension: soundness
    name: Tính Chặt Chẽ & Đúng Đắn (Soundness)
    weight: 0.35
  - dimension: actionability
    name: Tính Khả Thi & Hành Động (Actionability)
    weight: 0.2
  - dimension: clarity
    name: Định Dạng & Rõ Ràng (Clarity)
    weight: 0.15
scoring:
  pass_threshold: 80
  scale: 100
  critical_issue_behavior: instant_fail
