skill_id: dont-make-me-think-ux
skill_version: 1.0.0
title: Don't Make Me Think UX Architecture Rubric
description: Evaluates cognitive load reduction, 3-second scanability, visual
  hierarchy, F-pattern layout, and frictionless error prevention.
task_types:
  - id: ux_architecture
    name: Cognitive Usability & UX Architecture Spec
    required_sections:
      - pattern: 3-second scan|quét mắt 3 giây|visual hierarchy
        name: 3-Second Scanability & Visual Hierarchy
        severity: critical
      - pattern: noise|redundancy|cognitive load|giảm tải nhận thức|loại bỏ rác
        name: Noise & Redundancy Reduction
        severity: critical
      - pattern: primary action|hành động chính|f-pattern
        name: Unambiguous Primary Action
        severity: critical
      - pattern: frictionless|phòng ngừa lỗi|hướng dẫn
        name: Error Prevention & Frictionless Flow
        severity: major
prohibited_patterns:
  ux_architecture:
    - pattern: quá tải thông tin|nhồi nhét|nhãn nút mơ hồ|bấm vào đây
      issue_code: cognitive_overload_anti_pattern
      description: Cấm nhồi nhét thông tin dày đặc hoặc đặt tên nút bấm mơ hồ vô nghĩa.
      severity: critical
rubric_dimensions:
  - dimension: completeness
    name: Độ Đầy Đủ (Completeness)
    weight: 0.3
  - dimension: soundness
    name: Tính Chặt Chẽ & Đúng Đắn (Soundness)
    weight: 0.35
  - dimension: actionability
    name: Tính Khả Thi & Hành Động (Actionability)
    weight: 0.2
  - dimension: clarity
    name: Định Dạng & Rõ Ràng (Clarity)
    weight: 0.15
scoring:
  pass_threshold: 80
  scale: 100
  critical_issue_behavior: instant_fail
